[project]
name = "scoreocr"
version = "0.1.0"
description = "Piano sheet music to MusicXML transcription pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "pypdfium2>=4",
    "lxml>=5",
    "verovio>=4",
    "anthropic>=0.116",
    "httpx>=0.27",
    "cairosvg>=2.7",
    "python-dotenv>=1.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "music21>=9", "httpx>=0.27"]

[project.scripts]
score-transcribe = "scoreocr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
